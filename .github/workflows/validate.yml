name: Validate PanelForge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('No inline application script found')
          open('/tmp/panelforge-app.js', 'w', encoding='utf-8').write(inline[-1])
          print('Found', len(inline), 'inline application script(s)')
          PY
          node --check /tmp/panelforge-app.js
      - name: Check required app features
        run: |
          python3 - <<'PY'
          html = open('index.html', encoding='utf-8').read()
          checks = {
            'PDF.js script loading': 'pdfjsLib.getDocument' in html,
            'Comic PAGE heading parser': 'const headingRe=' in html,
            'Numbered panel parser': 'const panelRe=' in html,
            'Artwork attachment': 'pa.artwork=await fileData(file)' in html,
            'Print-to-PDF action': 'window.print()' in html,
            'Storyboard JSON export': 'JSON.stringify(data(),null,2)' in html,
            'Automatic storyboard build after upload': 'PDF read and storyboard built automatically.' in html,
            'CBZ comic assembly': 'function composePageBlob(page,index)' in html,
            'Local project restore': 'function restoreAutosave()' in html,
            'Dialogue overlay': 'makeLettering(pa.text)' in html,
          }
          for name, ok in checks.items():
            print(('PASS' if ok else 'FAIL') + ': ' + name)
          if not all(checks.values()):
            raise SystemExit('One or more required features are missing')
          PY
      - name: Run parser regression tests
        run: node tests/parser.test.cjs
